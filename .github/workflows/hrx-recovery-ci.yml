name: HRX Recovery CI

on:
  pull_request:
    branches:
      - recovery/hrx-20261117
    paths:
      - "hrx-recovery/**"
      - ".github/workflows/hrx-recovery-ci.yml"
  push:
    branches:
      - recovery/hrx-20261117
    paths:
      - "hrx-recovery/**"
      - ".github/workflows/hrx-recovery-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hrx-recovery-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Isolated verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: hrx-recovery
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: hrx-recovery/frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: hrx-recovery/backend/pom.xml

      - name: Install PostgreSQL 16 test binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16 clamav
          test -x /usr/lib/postgresql/16/bin/initdb
          test -x /usr/lib/postgresql/16/bin/pg_ctl

      - name: Prepare browser and TEST-only ClamAV database
        working-directory: hrx-recovery/frontend
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
          CHROME_BIN="$(node --input-type=module -e 'import { chromium } from "playwright-core"; process.stdout.write(chromium.executablePath());')"
          test -x "$CHROME_BIN"
          echo "HRX_CHROMIUM=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "HRX_BROWSER=true" >> "$GITHUB_ENV"
          echo "HRX_CLAMSCAN=/usr/bin/clamscan" >> "$GITHUB_ENV"
          echo "HRX_SIGNATURES=$RUNNER_TEMP/hrx-test-signatures" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/hrx-test-signatures"
          printf '%s\n' '44d88612fea8a8f36de82e1278abb02f:68:TEST-EICAR-ONLY' > "$RUNNER_TEMP/hrx-test-signatures/eicar.hdb"
          printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > "$RUNNER_TEMP/hrx-eicar.txt"
          if /usr/bin/clamscan --database="$RUNNER_TEMP/hrx-test-signatures" "$RUNNER_TEMP/hrx-eicar.txt"; then
            echo "TEST-only ClamAV signature failed to detect the EICAR probe" >&2
            exit 1
          else
            result=$?
            test "$result" -eq 1
          fi

      - name: Report toolchain
        run: |
          node --version
          npm --version
          java -version
          mvn -version
          /usr/lib/postgresql/16/bin/postgres --version

      - name: Run isolated end-to-end verification
        env:
          PGBIN: /usr/lib/postgresql/16/bin
        run: bash scripts/verify-isolated.sh

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hrx-recovery-verification-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            hrx-recovery/backend/target/surefire-reports/**
            hrx-recovery/frontend/dist/**
            hrx-recovery/frontend/target/**
